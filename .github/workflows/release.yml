# Builds the Imp installers for Windows, macOS and Linux and attaches them
# to a GitHub Release. Trigger it by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs

  create-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Imp ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use this repository and the tag's version
        shell: bash
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}.git"
          npm pkg set homepage="https://github.com/${GITHUB_REPOSITORY}"
      - name: Build and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
