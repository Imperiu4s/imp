<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwords</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .intro { margin: -8px 0 20px; max-width: 680px; line-height: 1.5; }
    .toolbar-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar-row .search { flex: 1; min-width: 200px; }
    .list-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 30px; }
    .list-bar .count { flex: 1; color: var(--text-2); font-weight: 550; }
    .avatar { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; text-transform: uppercase; }
    .pw-row .grow { flex: 1 1 200px; }
    .secret { flex: 0 1 220px; min-width: 0; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.04em; }
    .secret.shown { color: var(--text); letter-spacing: 0; user-select: text; }
    .pw-row .actions { opacity: 1; }
    .pw-row .actions .icon-btn:not(.keep) { opacity: 0; transition: opacity 0.1s; }
    .pw-row:hover .actions .icon-btn, .pw-row:focus-within .actions .icon-btn { opacity: 1; }
    .never-row .grow { font-weight: 550; }
    .pass-field { position: relative; display: grid; }
    .pass-field .input { padding-right: 44px; }
    .pass-field .icon-btn { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
    @media (max-width: 640px) { .secret { display: none; } }
  </style>
</head>
<body data-title-key="pwm.title">
  <div class="page">
    <div class="page-head">
      <h1><span data-icon="password" data-size="26"></span><span data-i18n="pwm.title"></span></h1>
      <button class="btn small" id="import" data-icon="file" data-size="14"><span data-i18n="pwm.import"></span></button>
      <button class="btn small" id="export" data-icon="upload" data-size="14"><span data-i18n="pwm.export"></span></button>
    </div>
    <p class="intro muted" data-i18n="pwm.intro"></p>
    <div class="toolbar-row">
      <div class="search"><span data-icon="search" data-size="16"></span><input id="q" class="input" data-i18n-ph="pwm.search" spellcheck="false"></div>
      <button class="btn" id="add" data-icon="plus" data-size="15"><span data-i18n="pwm.add"></span></button>
    </div>
    <div class="list-bar">
      <span class="count" id="count"></span>
      <button class="btn small danger" id="delete-all" data-icon="trash" data-size="14" hidden><span data-i18n="pwm.deleteAll"></span></button>
    </div>
    <div class="card list" id="items"></div>
    <div id="never-box" hidden>
      <div class="group-title" data-i18n="pwm.never"></div>
      <p class="muted" data-i18n="pwm.neverDesc"></p>
      <div class="card list" id="never"></div>
    </div>
  </div>

  <dialog id="edit">
    <form method="dialog" id="edit-form">
      <h2 id="edit-title"></h2>
      <label><span data-i18n="pwm.site"></span><input class="input" id="f-url" placeholder="https://example.com" spellcheck="false" required></label>
      <label><span data-i18n="pw.username"></span><input class="input" id="f-user" spellcheck="false" autocomplete="off"></label>
      <label><span data-i18n="pw.password"></span><span class="pass-field"><input class="input" id="f-pass" type="password" spellcheck="false" autocomplete="new-password">
        <button type="button" class="icon-btn" id="f-eye"></button></span></label>
      <div class="buttons">
        <button type="button" class="btn" id="edit-cancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <script src="/shared/i18n.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="common.js"></script>
  <script src="passwords.js"></script>
</body>
</html>
